<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contáctame por WhatsApp — Jonatan Domínguez</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/assets/iconos/favicon-d-naranja.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Header ---- */
    .page-header {
      display: flex;
      justify-content: flex-end;
      padding: 14px 24px;
    }
    .page-header a {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #ccc;
      font-size: 13px;
      text-decoration: none;
      transition: color .2s;
    }
    .page-header a:hover { color: #fff; }
    .page-header svg { flex-shrink: 0; }

    /* ---- Main ---- */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 20px 56px;
      gap: 32px;
    }

    /* ---- Image card ---- */
    .img-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      width: 100%;
      max-width: 900px;
      box-shadow: 0 8px 40px rgba(0,0,0,.6);
    }
    .img-card img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ---- Mobile-only note ---- */
    .mobile-note {
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      color: #fff;
      text-align: center;
      line-height: 1.4;
      letter-spacing: .04em;
      max-width: 340px;
    }

    /* ---- CTA button ---- */
    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #25D366;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 18px 48px;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 4px 24px rgba(37,211,102,.35);
      transition: background .18s, transform .18s, box-shadow .18s;
    }
    .btn-whatsapp:hover {
      background: #1ebe5d;
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(37,211,102,.5);
    }
    .btn-whatsapp svg { flex-shrink: 0; }

    /* ---- Responsive ---- */

    /* Desktop: web image visible, mobile image hidden */
    .img-desktop { display: block; }
    .img-mobile  { display: none; }

    @media (max-width: 679px) {
      .img-desktop { display: none; }
      .img-mobile  {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        width: 100%;
      }
      .img-mobile .img-card {
        max-width: 100%;
        border-radius: 10px;
      }
      .btn-whatsapp {
        font-size: 16px;
        padding: 16px 36px;
      }
    }
  </style>
</head>
<body>

  <header class="page-header">
    <a href="mailto:jonatan@jonatand.com">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
      </svg>
      jonatan@jonatand.com
    </a>
  </header>

  <main>

    <!-- Versión escritorio -->
    <div class="img-desktop">
      <div class="img-card">
        <img
          src="/assets/Captación/contacto-whatsapp-web.png"
          alt="Paso 1: toca CONTACTAME AHORA. Paso 2: toca los 3 puntos arriba a la derecha. Paso 3: toca ABRIR EN EL NAVEGADOR."
          loading="eager"
        />
      </div>
    </div>

    <!-- Versión móvil -->
    <div class="img-mobile">
      <div class="img-card">
        <img
          src="/assets/Captación/contacto-whatsapp-movil.jpg"
          alt="Paso 1: toca los 3 puntos arriba a la derecha. Paso 2: toca ABRIR EN EL NAVEGADOR."
          loading="eager"
        />
      </div>
      <p class="mobile-note">Mira la imagen de arriba antes de pulsar el botón de &ldquo;CONTACTAME AHORA&rdquo;</p>
    </div>

    <!-- Botón WhatsApp -->
    <a
      href="https://api.whatsapp.com/send?phone=34611893934"
      class="btn-whatsapp"
      target="_blank"
      rel="noopener"
    >
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
      </svg>
      CONTACTAME AHORA
    </a>

  </main>

</body>
</html>
